[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-qc"                       # the PyPI name: check it is free at https://pypi.org/project/aio-qc/
dynamic = ["version"]                 # read from AIO_QC/__init__.py (__version__): bump it in one place
description = "All-in-one quality control for annotated image datasets (LabelMe and YOLO)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }        # MIT (AIO QC's own code); bundled third-party: THIRD_PARTY_NOTICES.md, licenses/
authors = [{ name = "Preetkaran Singh" }]
keywords = ["annotation", "quality control", "labelme", "yolo", "dataset", "computer vision", "qc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.23",
    "opencv-python>=4.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
full = ["natsort>=8.0", "Pillow>=9.5", "PyYAML>=6.0", "orjson>=3.9"]

[project.urls]
Homepage = "https://github.com/3ST4R/aio-qc"
Issues = "https://github.com/3ST4R/aio-qc/issues"
Changelog = "https://github.com/3ST4R/aio-qc/blob/main/AIO_QC/CHANGES.md"

[project.gui-scripts]
aio-qc = "AIO_QC.__main__:main"       # `aio-qc` command (no console window on Windows)

[project.scripts]
aio-qc-console = "AIO_QC.__main__:main"   # same app, with a console (logs visible) — handy for troubleshooting

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]   # in the wheel's .dist-info, next to the metadata

[tool.setuptools.dynamic]
version = { attr = "AIO_QC.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["AIO_QC*"]

[tool.setuptools.package-data]
# the bundled LabelMe / labelImg sources ("Fix in Editor") are not importable packages — ship them as data, whole
"AIO_QC" = ["editors/**/*", "icons/**/*", "fonts/**/*", "validators/**/*", "THIRD_PARTY_NOTICES.md"]
"*" = ["*.svg", "*.png", "*.ico", "*.ttf", "*.otf", "*.json", "*.yaml", "*.md", "*.txt", "*.zip", "*.toml",
       "*.qrc", "*.ui", "*.cfg", "*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
