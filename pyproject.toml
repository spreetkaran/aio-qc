[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-qc"                       # the PyPI name: check it is free at https://pypi.org/project/aio-qc/
dynamic = ["version"]                 # read from AIO_QC/__init__.py (__version__): bump it in one place
description = "Find and fix annotation errors in LabelMe and YOLO datasets before training, plus Data Studio for tables — one desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"          # SPDX (PEP 639); bundled third-party: THIRD_PARTY_NOTICES.md, licenses/
license-files = ["LICENSE", "licenses/*", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Preetkaran Singh" }]
keywords = ["annotation", "quality control", "labelme", "yolo", "dataset", "computer vision", "qc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.23",
    "opencv-python>=4.7",
    "loguru>=0.7",
]

[project.optional-dependencies]
full = ["natsort>=8.0", "Pillow>=9.5", "PyYAML>=6.0", "orjson>=3.9", "pandas>=2.0", "pyarrow>=14", "openpyxl>=3.1"]
data = ["pandas>=2.0", "pyarrow>=14", "openpyxl>=3.1"]        # Data Studio (tables); PySpark runs in its own env

[project.urls]
Homepage = "https://github.com/spreetkaran/aio-qc"
Issues = "https://github.com/spreetkaran/aio-qc/issues"
Releases = "https://github.com/spreetkaran/aio-qc/releases/tag/v2.0.0"
Changelog = "https://github.com/spreetkaran/aio-qc/blob/main/AIO_QC/CHANGES.md"

[project.gui-scripts]
aio-qc = "AIO_QC.__main__:main"       # `aio-qc` command (no console window on Windows)

[project.scripts]
aio-qc-console = "AIO_QC.__main__:main"   # same app, with a console (logs visible) — handy for troubleshooting

[tool.setuptools]
include-package-data = true                 # everything MANIFEST.in lists

[tool.setuptools.dynamic]
version = { attr = "AIO_QC.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["AIO_QC*"]

[tool.setuptools.package-data]
# the bundled LabelMe / labelImg sources ("Fix in Editor") are not importable packages — ship them as data, whole
"AIO_QC" = ["editors/**/*", "icons/**/*", "fonts/**/*", "validators/**/*", "CHANGES.md"]
"*" = ["*.svg", "*.png", "*.ico", "*.ttf", "*.otf", "*.json", "*.yaml", "*.md", "*.txt", "*.zip", "*.toml",
       "*.qrc", "*.ui", "*.cfg", "*.py"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
